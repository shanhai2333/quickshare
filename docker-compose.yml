# QuickShare —— NAS 部署用的 compose 文件。
#
# 用法：把本文件和 Dockerfile 一起放到 NAS 上任意目录，
#       按下面标了 ★ 的两处改成自己的路径和端口，然后：
#         docker compose up -d
#
# 只想用现成镜像的话，把 build / image 两行换成你自己的镜像地址即可。
services:
  quickshare:
    build: .
    image: quickshare:latest
    container_name: quickshare
    restart: unless-stopped

    ports:
      # ★ 左边是 NAS 对外暴露的端口，右边要和 QS_ADDR 里的端口一致
      - "8080:8080"

    environment:
      TZ: "Asia/Shanghai"
      QS_ADDR: ":8080"

      # ★ 容器内的数据目录。
      #
      # 注意：**只要这里设了值，设置界面里的「文件存储位置」就是只读的**。
      # 这是有意为之——容器里能看到的只有映射进来的目录，
      # 在界面上把路径指到没映射的地方，等于写进容器可写层，容器一重建文件就没了。
      # 所以要换存储位置，请改下面的 volumes 映射，而不是改这个值。
      QS_DATA_DIR: "/data"

      # 访问口令。留空 = 内网免鉴权；要暴露到公网务必设一个长随机串
      QS_ADMIN_TOKEN: ""

      # 托盘图标是 Windows 桌面专属功能。Linux 容器里没有桌面环境，
      # 这一项本来就会被自动忽略，写出来只是留个说明，删掉也不影响。
      QS_TRAY: "0"

      QS_CHUNK_SIZE: "8388608"     # 分片大小，默认 8 MiB
      QS_MAX_FILE_SIZE: "0"        # 单文件上限（字节），0 表示不限
      QS_UPLOAD_TTL_HOURS: "24"    # 未完成上传保留多久后清理

      # 更新检查。容器通常有外网，所以默认开着；设置面板的「关于」里会显示
      # 有没有新版本。**完全不出网的内网设成 "0"**，免得每次打开设置面板都
      # 白等一次必然失败的请求（不会卡住界面，但也没意义）。
      QS_UPDATE_CHECK: "1"
      # 想改检查哪个仓库就填 "owner/name"。留空 = 用构建时注入的那个
      # （正式发布的镜像里已经注好了，正常不用管这一项）。
      QS_UPDATE_REPO: ""

    # 让容器以 NAS 上的目标用户身份运行，避免数据目录权限问题。
    # 在 .env 里设置 PUID / PGID（群晖常见 1026，威联通常见 1000）
    #
    # ★ 启动时报 "mkdir /data/files: permission denied" 就改这里。
    #
    # 原因：bind mount 会把镜像内 /data 的属主**整个盖掉**，容器能不能写
    # 只看宿主机上那个目录的属主。而 OpenWrt / NAS 上新 mkdir 出来的目录
    # 默认是 root:root，容器以非 root 跑就写不进去。
    #
    # OpenWrt 上最省事——直接用 root 跑（内网自用够安全）：
    #   user: "0:0"
    #
    # 想保持非 root，就去宿主机上把目录属主改成和下面一致：
    #   mkdir -p /mnt/sda1/quickshare
    #   chown -R 1000:1000 /mnt/sda1/quickshare
    #   （OpenWrt 上 chown 用数字 uid 即可，不必先在 /etc/passwd 里建用户）
    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      # ★ 左边改成 NAS 上的真实路径，右边保持 /data 不动（要和 QS_DATA_DIR 一致）
      #   群晖：  /volume1/quickshare
      #   威联通：/share/Container/quickshare
      #
      # 想直接落到已有的共享目录里也行，把左边指过去就是，比如：
      #   - /volume1/homes/your-name/QuickShare:/data
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
